<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Chicago Mark</title>
    <style>
      body { min-height:100vh;margin:0;display:grid;place-items:center;background:#f7f1ed;color:#172323;font:16px system-ui,sans-serif; }
      main { display:grid;gap:2rem;text-align:center; }
      section { padding:2rem;border:1px solid #d7cbc4;border-radius:1rem;background:#fff; }
      output { display:block;min-height:1.5em;margin-top:1rem;color:#6a5550; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Default Chicago red</h1>
        <jd-pens-chicago-mark></jd-pens-chicago-mark>
      </section>
      <section>
        <h2>Themed</h2>
        <jd-pens-chicago-mark
          base-color="#0A7B83"
          size="84"
          heart-weight="2"
          pen-weight="1"
          stout-weight="1"
          full-after-taps="5"
          full-after-ms="1000"
        ></jd-pens-chicago-mark>
      </section>
      <section>
        <h2>Hold to ink, custom particles</h2>
        <jd-pens-chicago-mark
          id="armed"
          base-color="#bd5847"
          hold-to-ink
          hold-ms="1600"
          ink-color="#27467a"
          pen-weight="0"
        ></jd-pens-chicago-mark>
      </section>
      <output id="events" aria-live="polite"></output>
    </main>
    <script type="module">
      import '../dist/index.js';
      const output = document.querySelector('#events');
      document.addEventListener('jd-chicago-mark-tap', (event) => {
        output.textContent = `Tap ${event.detail.streakCount} · burst ${event.detail.burstSize}`;
      });
      document.addEventListener('jd-chicago-mark-full-celebration', () => {
        output.textContent = 'Full celebration unlocked';
      });
      document.addEventListener('jd-chicago-mark-hold', (event) => {
        output.textContent = `Held for ${event.detail.holdMs} ms`;
      });
      // A custom drop and a custom nib stand in for the built-in pen at the same share.
      document.querySelector('#armed').particles = [
        {
          svg: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6C10.6 4.9 12.4 7.6 12.4 10.1a4.4 4.4 0 0 1-8.8 0c0-2.5 1.8-5.2 4.4-8.5Z" fill="#27467a"/></svg>',
          weight: 0.15,
        },
        {
          svg: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.6 1.8h6.8l1.4 5.4L8 14.6 3.2 7.2Z" fill="#1c1813"/></svg>',
          weight: 0.12,
        },
      ];
    </script>
  </body>
</html>
